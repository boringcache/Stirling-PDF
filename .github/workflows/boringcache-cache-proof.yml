name: BoringCache cache proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .boringcache.toml
      - .github/boringcache/**
      - .github/workflows/boringcache-cache-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle:
    name: Build backend with Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORINGCACHE_ENABLED: ${{ vars.BORINGCACHE_ENABLED == 'true' && (secrets.BORINGCACHE_RESTORE_TOKEN != '' || (github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN != '')) && 'true' || 'false' }}
      STIRLING_FLAVOR: core
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore Gradle dependencies with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@ab52a39d3d7358c22b359a6ffbf86cf74be9bf56 # v1.18.1
        with:
          trust-policy: auto
          setup: none
          mode: archive
          cache-profiles: gradle-dependencies
          metadata-hints: workflow=boringcache-cache-proof,job=gradle
          diagnostics: summary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Configure Gradle build cache with BoringCache
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@ab52a39d3d7358c22b359a6ffbf86cf74be9bf56 # v1.18.1
        with:
          trust-policy: auto
          setup: none
          mode: gradle
          metadata-hints: workflow=boringcache-cache-proof,job=gradle
          diagnostics: summary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Gradle User Home
        if: env.BORINGCACHE_ENABLED != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-jdk-25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-jdk-25-
            gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Build backend
        run: task backend:build:ci

  docker:
    name: Build unoserver with Docker cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORINGCACHE_ENABLED: ${{ vars.BORINGCACHE_ENABLED == 'true' && (secrets.BORINGCACHE_RESTORE_TOKEN != '' || (github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN != '')) && 'true' || 'false' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        id: buildx
        if: env.BORINGCACHE_ENABLED != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Docker cache with BoringCache
        id: boringcache-docker
        if: env.BORINGCACHE_ENABLED == 'true'
        uses: boringcache/one@ab52a39d3d7358c22b359a6ffbf86cf74be9bf56 # v1.18.1
        with:
          trust-policy: auto
          setup: none
          mode: docker
          working-directory: .github/boringcache/docker-unoserver
          docker-command: setup
          metadata-hints: workflow=boringcache-cache-proof,job=docker
          diagnostics: summary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}

      - name: Build unoserver image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.boringcache-docker.outputs.buildx-name || steps.buildx.outputs.name }}
          context: .
          file: ./docker/unoserver/Dockerfile
          push: false
          cache-from: ${{ env.BORINGCACHE_ENABLED == 'true' && steps.boringcache-docker.outputs.cache-from || 'type=gha,scope=stirling-unoserver' }}
          cache-to: ${{ env.BORINGCACHE_ENABLED == 'true' && steps.boringcache-docker.outputs.cache-to || 'type=gha,mode=max,scope=stirling-unoserver' }}
          tags: stirling-unoserver:cache-proof
          platforms: linux/amd64

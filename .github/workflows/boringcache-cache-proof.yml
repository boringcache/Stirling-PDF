name: BoringCache Gradle proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .boringcache.toml
      - .github/workflows/boringcache-cache-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle:
    name: Build backend with Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      STIRLING_FLAVOR: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: 9.6.1
          cache-disabled: true

      - name: Set up Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Configure Gradle cache
        uses: boringcache/one@6b7033721b37075b2138fd0c769bf088e0836ce6 # v1.14.0
        with:
          cli-version: v1.14.0
          setup: none
          mode: gradle
          trust-policy: auto
          gradle-home: ~/.gradle
          enable-build-cache: "true"
          diagnostics: summary
          fail-on-cache-error: "true"

      - name: Build backend
        run: task backend:build:ci

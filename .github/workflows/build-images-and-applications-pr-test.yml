name: Build Docker images and applications (PR test)

on:
  push:
    branches:
      - pr/native-boringcache-proof
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: native-build-proof
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/boringcache/stirling-pdf-fork-proof
  BORINGCACHE_WORKSPACE: stirling-tools/stirling-pdf

jobs:
  build:
    name: Build Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cli_platform: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            cli_platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          case "${EXPECTED_ARCH}:${actual}" in
            amd64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *)
              echo "Expected ${EXPECTED_ARCH}, got ${actual}" >&2
              exit 1
              ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: boringcache/one@58df2c0d6884ecd5e430feeeaf7e477656864771 # v1.13.102
        with:
          cli-version: vcli-canary-36dce310264e
          setup: none
          mode: docker
          workspace: ${{ env.BORINGCACHE_WORKSPACE }}
          cli-platform: ${{ matrix.cli_platform }}
          cache-runtime: "false"
          cache-tag: stirling-native-${{ matrix.arch }}
          managed-buildkit-image: ghcr.io/boringcache/buildkit@sha256:2f6ddc6319f598180955e89e3a846b259b216458d528912c1477700670c96869
          docker-tool-cache: gradle:stirling-gradle
          context: .
          dockerfile: docker/embedded/Dockerfile
          image: ${{ env.IMAGE }}
          tags: run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: VERSION_TAG=cache-proof
          push: "true"
          load: "false"
          provenance: "true"
          sbom: "true"
          fail-on-cache-error: "true"
          verify: wait
          diagnostics: summary

  gradle:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
      STIRLING_FLAVOR: core
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: 9.6.1
          cache-disabled: true

      - name: Set up Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Set up Gradle cache
        uses: boringcache/one@58df2c0d6884ecd5e430feeeaf7e477656864771 # v1.13.102
        with:
          cli-version: vcli-canary-36dce310264e
          setup: none
          mode: gradle
          workspace: ${{ env.BORINGCACHE_WORKSPACE }}
          cache-runtime: "false"
          cache-tag: stirling-gradle
          gradle-home: ~/.gradle
          enable-build-cache: "true"
          entries: |
            stirling-backend-gradle-wrapper:~/.gradle/wrapper
            stirling-backend-gradle-modules:~/.gradle/caches/modules-2
          save-always: "true"
          fail-on-cache-error: "true"
          verify: wait
          diagnostics: summary

      - name: Build backend
        run: task backend:build:ci

  rust:
    name: Build Tauri application (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            librsvg2-dev \
            libsoup2.4-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: 9.6.1
          cache-disabled: true

      - name: Set up Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Set up Gradle cache
        uses: boringcache/one@58df2c0d6884ecd5e430feeeaf7e477656864771 # v1.13.102
        with:
          cli-version: vcli-canary-36dce310264e
          setup: none
          mode: gradle
          workspace: ${{ env.BORINGCACHE_WORKSPACE }}
          cache-runtime: "false"
          cache-tag: stirling-gradle
          gradle-home: ~/.gradle
          enable-build-cache: "true"
          entries: |
            stirling-tauri-gradle-wrapper:~/.gradle/wrapper
            stirling-tauri-gradle-modules:~/.gradle/caches/modules-2
            npm-cache
          save-always: "true"
          fail-on-cache-error: "true"
          verify: wait
          diagnostics: summary

      - name: Set up Rust cache
        uses: boringcache/one@58df2c0d6884ecd5e430feeeaf7e477656864771 # v1.13.102
        with:
          cli-version: vcli-canary-36dce310264e
          setup: none
          mode: rust-sccache
          workspace: ${{ env.BORINGCACHE_WORKSPACE }}
          cache-runtime: "false"
          working-directory: frontend/editor/src-tauri
          cache-tag: stirling-tauri
          rust-version: stable
          cache-cargo: "false"
          cache-target: "false"
          sccache: "true"
          sccache-mode: proxy
          save-always: "true"
          fail-on-cache-error: "true"
          verify: wait
          diagnostics: summary

      - name: Prepare desktop build
        env:
          DISABLE_ADDITIONAL_FEATURES: "true"
          JPDFIUM_PLATFORMS: linux-x64
        run: task desktop:prepare

      - name: Run Tauri/Cargo tests
        run: task desktop:test

  manifest:
    name: Publish Docker manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Merge platform images
        run: |
          set -euo pipefail
          prefix="${IMAGE}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create \
            --tag "${prefix}" \
            "${prefix}-amd64" \
            "${prefix}-arm64"

          inspect="$(docker buildx imagetools inspect "${prefix}")"
          printf '%s\n' "$inspect"
          grep -q 'linux/amd64' <<< "$inspect"
          grep -q 'linux/arm64' <<< "$inspect"
